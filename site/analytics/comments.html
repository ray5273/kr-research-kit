<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>댓글 관리 · KR Research</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --surface: #f5f5f7;
        --ink: #1d1d1f;
        --muted: #626267;
        --line: #e8e8ed;
        --accent: #d64d00;
        --soft: #fff3eb;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000;
          --surface: #161617;
          --ink: #f5f5f7;
          --muted: #a1a1a6;
          --line: #2c2c2e;
          --accent: #ff7a2f;
          --soft: #2a1608;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.6;
      }
      a {
        color: var(--accent);
      }
      header {
        border-bottom: 1px solid var(--line);
      }
      header > div,
      main {
        max-width: 1180px;
        margin: auto;
        padding: 20px 28px;
      }
      header > div {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header a {
        text-decoration: none;
        color: var(--ink);
      }
      header b {
        font-size: 20px;
        letter-spacing: -1px;
      }
      header i {
        color: var(--accent);
        font-style: normal;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        margin: 24px 0 8px;
      }
      h1 {
        font-size: 38px;
        letter-spacing: -1.5px;
        line-height: 1.2;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 21px;
        letter-spacing: -0.5px;
        margin: 0 0 18px;
      }
      h3 {
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 24px 0;
      }
      button,
      select,
      input {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        padding: 9px 13px;
        border-radius: 8px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
        margin: 24px 0;
      }
      nav button {
        border: 0;
      }
      nav button[aria-current="page"] {
        color: var(--accent);
        background: var(--soft);
      }
      .status {
        padding: 16px 18px;
        background: var(--surface);
        border-radius: 12px;
        font-size: 13px;
      }
      .status[data-error="true"] {
        border: 1px solid var(--accent);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin: 28px 0;
      }
      .metric {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
      }
      .metric b {
        display: block;
        font-size: 32px;
        letter-spacing: -1px;
        line-height: 1.4;
      }
      .metric span {
        font-size: 13px;
        color: var(--muted);
      }
      section.panel {
        border-top: 1px solid var(--line);
        margin: 30px 0;
        padding-top: 24px;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        white-space: nowrap;
        font-size: 14px;
      }
      th,
      td {
        padding: 14px 12px;
        text-align: right;
        border-bottom: 1px solid var(--line);
      }
      th {
        font-size: 12px;
        color: var(--muted);
      }
      th:first-child,
      td:first-child {
        text-align: left;
        white-space: normal;
        min-width: 220px;
      }
      td button {
        font-weight: 600;
        text-align: left;
        padding: 0;
        border: 0;
        color: var(--accent);
      }
      .chart {
        width: 100%;
        height: 180px;
        color: var(--accent);
        display: block;
      }
      .chart-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .insight {
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 10px;
        padding: 20px;
        margin: 14px 0;
      }
      .tag {
        font-size: 12px;
        color: var(--accent);
        background: var(--soft);
        border-radius: 6px;
        padding: 3px 7px;
        margin-right: 8px;
      }
      .empty {
        padding: 36px 0;
        color: var(--muted);
      }
      footer {
        color: var(--muted);
        font-size: 12px;
        margin: 48px 0 24px;
      }
      .reading {
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
      }
      #content[aria-busy="true"] {
        opacity: 0.5;
      }
      @media (max-width: 700px) {
        header > div,
        main {
          padding: 16px 20px;
        }
        h1 {
          font-size: 30px;
        }
        .metrics {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .metric {
          padding: 14px;
        }
        .metric b {
          font-size: 26px;
        }
        .toolbar > label:last-of-type {
          width: 100%;
        }
        select#article {
          max-width: 100%;
        }
        header small {
          display: none;
        }
      }
    </style>
    <style>
      header > div {flex-wrap:wrap;gap:12px}
      .toolbar label {max-width:100%;min-width:0}
      .admin-tabs {margin-top:0}
      .admin-tabs a {padding:9px 13px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600}
      .admin-tabs a[aria-current="page"] {color:var(--accent);background:var(--soft)}
      #tabs button {white-space:nowrap}
      #tabs button[aria-pressed="true"] {color:var(--accent);background:var(--soft);border-color:transparent}
      .comment {border-bottom:1px solid var(--line);padding:20px 0;overflow-wrap:anywhere}
      .comment-head {display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
      .comment-head input {width:20px;height:20px;padding:0;align-self:center}
      .comment p {margin:6px 0;white-space:pre-wrap}
      .comment .muted {font-size:13px}
      .actions {display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
      .warn {color:var(--accent);font-weight:700}
      .operator-reply {margin:12px 0 0 12px;padding:10px 14px;background:var(--surface);border-left:2px solid var(--accent);border-radius:8px}
      details {margin-top:12px}
      summary {cursor:pointer;font-size:14px;min-height:28px}
      textarea {display:block;width:100%;min-height:90px;margin:8px 0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:9px 13px;border-radius:8px;resize:vertical}
      textarea:focus-visible {outline:2px solid var(--accent);outline-offset:3px}
      #bulk {position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;background:var(--bg);border-top:1px solid var(--line)}
      #bulk label {display:flex;gap:8px;align-items:center}
      #bulk input {width:20px;height:20px;padding:0}
      #bulk .actions {margin:0}
      #guard {border-top:1px solid var(--line);margin-top:32px;padding-top:12px}
      #words {display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
      #words button {padding:4px 10px;font-size:13px}
      #word-form {display:flex;gap:8px;flex-wrap:wrap}
      #word-form input {flex:1;min-width:140px}
      select {max-width:100%}
      [hidden] {display:none !important}
      @media (max-width:700px) {
        .comment button,#bulk button,#tabs button {min-height:44px}
        .toolbar input,.toolbar select {width:100%}
        .toolbar label {width:100%}
      }
    </style>
    <script src="/admin/comments.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <b>KR Research<i>.</i></b
        ><a href="/">공개 사이트 ↗</a>
        <form action="/admin/logout" method="post">
          <button>로그아웃</button>
        </form>
      </div>
    </header>
    <main>
      <nav class="admin-tabs" aria-label="관리 화면">
        <a href="/admin/">방문 통계</a>
        <a href="/admin/comments/" aria-current="page">댓글<span id="comment-badge"></span></a>
      </nav>
      <p class="eyebrow">RESEARCH / COMMENTS</p>
      <h1>댓글 관리</h1>
      <p class="muted">
        승인한 댓글만 공개됩니다. 대기·스팸은 작성 30일 후, 휴지통은 이동 30일 후 정리됩니다.
      </p>
      <p id="focus" hidden>
        이 댓글만 보는 중입니다. <a href="/admin/comments/">전체 목록 보기</a>
      </p>
      <nav id="tabs" aria-label="댓글 상태">
        <button type="button" data-status="pending" aria-pressed="true"></button>
        <button type="button" data-status="approved" aria-pressed="false"></button>
        <button type="button" data-status="hidden" aria-pressed="false"></button>
        <button type="button" data-status="spam" aria-pressed="false"></button>
        <button type="button" data-status="trash" aria-pressed="false"></button>
      </nav>
      <form id="filters" class="toolbar">
        <label
          >글
          <select id="path">
            <option value="">전체 글</option>
          </select></label
        ><label
          >검색
          <input id="q" type="search" maxlength="100" placeholder="닉네임 또는 본문" /></label
        ><label
          >정렬
          <select id="sort">
            <option value="newest">최신순</option>
            <option value="oldest">오래된 순</option>
          </select></label
        ><button>조회</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="retry" hidden>다시 시도</button>
      <div id="comments"></div>
      <button id="more" hidden>더 불러오기</button>
      <div id="bulk" hidden>
        <label><input id="select-all" type="checkbox" />불러온 항목 전체 선택</label>
        <span id="selected" class="muted"></span>
        <span id="bulk-actions" class="actions"></span>
      </div>
      <section id="guard">
        <h2>스팸 방지</h2>
        <p>
          차단 중인 작성자 <b id="block-count">—</b>명 (90일 후 자동 해제)
          <button type="button" id="clear-blocks">전체 해제</button>
        </p>
        <h3>금칙어</h3>
        <p class="muted">공백을 무시하고 비교합니다. 걸린 댓글은 스팸 탭으로 갑니다. 단어를 누르면 삭제합니다.</p>
        <div id="words"></div>
        <form id="word-form">
          <input id="word" maxlength="50" required aria-label="추가할 금칙어" placeholder="추가할 단어" />
          <button>추가</button>
        </form>
      </section>
    </main>
  </body>
</html>
