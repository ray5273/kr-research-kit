interface:
  display_name: "Korean Stock Plan"
  short_description: "Scope a Korean stock request into a usable research brief and orchestrate fresh memo versus follow-up versus update flows."
  default_prompt: "Use $kr-stock-plan to scope and orchestrate Korean single-stock research. Classify every operating company as `Order-driven company: yes / no / deferred`; when yes, route through $kr-stock-dart-analysis and $kr-order-backlog-analysis and require a backlog PNG whenever DART/KRX provides a quantitative amount. Then continue into $kr-stock-data-pack, $kr-stock-analysis, or $kr-stock-update unless the user asked for planning only."

policy:
  allow_implicit_invocation: true
