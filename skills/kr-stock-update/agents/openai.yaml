interface:
  display_name: "KR Stock Update"
  short_description: "Maintain an existing Korean stock memo with baseline-aware, gated dated updates."
  default_prompt: "Use $kr-stock-update to maintain `analysis-example/kr/<company>/memo.md` while preserving 기준일. For an order-driven memo, treat any material order, amendment, cancellation, termination, or new backlog filing as a synchronized refresh of $kr-stock-dart-analysis, $kr-order-backlog-analysis, `Order Backlog and Revenue Visibility`, and the linked backlog JSON/Markdown/PNG package."

policy:
  allow_implicit_invocation: true
