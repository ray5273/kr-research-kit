<article>
<p class="crumbs">{{crumbs}}</p>
<h1>{{headline}}</h1>
<p class="meta">{{metaLine}}</p>
<section class="answer" aria-label="핵심 답변">
<p class="label">핵심 답변</p>
<p class="lead">{{answerLead}}</p>
{{answerBody}}
<p class="asof">기준일 {{asOfDate}} · 최근 업데이트 {{dateModified}}</p>
</section>
{{legend}}
{{body}}
{{updates}}
{{sources}}
<p class="tags">{{tags}}</p>
<p class="disclaimer">{{disclaimer}}</p>
</article>
