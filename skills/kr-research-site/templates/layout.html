<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="alternate" type="application/atom+xml" title="{{siteName}}" href="{{baseUrl}}/feed.xml">
<meta name="robots" content="{{robots}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:locale" content="ko_KR">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{shareTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
{{ogImage}}
<meta name="twitter:card" content="{{twitterCard}}">
<meta name="twitter:title" content="{{shareTitle}}">
<meta name="twitter:description" content="{{description}}">
{{head}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#ffffff;--surface:#f5f5f7;--ink:#1d1d1f;--ink-2:#424245;--muted:#86868b;--line:#e8e8ed;
  --accent:#ea5a0c;--accent-soft:#fff3eb;
  --pos:#d1242f;--pos-bg:#fdecee;--neg:#1f63d6;--neg-bg:#e8f0fd;--neu:#6e6e73;--neu-bg:#f0f0f2;--spec:#9a5b13;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--surface:#161617;--ink:#f5f5f7;--ink-2:#d2d2d7;--muted:#8e8e93;--line:#2c2c2e;--accent:#ff7a2f;--accent-soft:#2a1608;
  --pos:#ff6b6b;--pos-bg:#3a1618;--neg:#5aa2ff;--neg-bg:#13253f;--neu:#a1a1a6;--neu-bg:#232325;--spec:#e0a458}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.narrow{max-width:720px;margin:0 auto}

/* header / footer */
header.site{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
header.site .wrap{height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font:700 19px/1 var(--display);letter-spacing:-.03em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:12.5px;color:var(--muted)}
header.site nav{display:flex;gap:24px;font-size:14px;color:var(--ink-2)}
header.site nav a:hover{color:var(--ink)}
footer.site{border-top:1px solid var(--line);padding:24px 0 40px;font-size:12.5px;color:var(--muted);margin-top:24px}
footer.site p{margin:0 0 6px}
footer.site a{margin-right:12px}
footer.site a:hover{color:var(--ink)}

/* shared bits */
.badge{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--sans);padding:5px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.pos{color:var(--pos);background:var(--pos-bg)}.badge.neg{color:var(--neg);background:var(--neg-bg)}.badge.neu{color:var(--neu);background:var(--neu-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.mk{font-weight:600;color:var(--accent)}
.tk{font:600 12.5px/1 var(--mono);color:var(--muted)}
.asof{font:600 12px/1 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;white-space:nowrap}
.asof b{color:var(--accent);font-weight:700;margin-right:4px}
.sub{color:var(--muted);font-size:13px}

/* home: recommended */
.rec{padding:48px 0 40px}
.rec h1,.list-head h1{font:700 40px/1.15 var(--display);letter-spacing:-.04em;margin:0 0 6px}
.rec .lede,.list-head p{color:var(--muted);margin:0 0 28px;font-size:17px}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
.grid.one{grid-template-columns:1fr}
.stack{display:grid;gap:24px;align-content:start}
.card{display:block;background:var(--surface);border-radius:20px;overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card .img{position:relative}
.card img,.card .ph{width:100%;aspect-ratio:8/5;object-fit:cover;display:block}
.card .ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface));font:700 28px var(--display);color:var(--accent)}
.card .img .asof{position:absolute;left:12px;top:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card .in{padding:20px 22px 22px}
.card h3{font:700 24px/1.3 var(--display);letter-spacing:-.03em;margin:10px 0 8px}
.card p{margin:0;color:var(--ink-2);font-size:15.5px}
.stack .card h3,.more .card h3{font-size:18px}
.stack .card .in,.more .card .in{padding:16px 18px 18px}

/* lists */
.list-head{padding:48px 0 12px}
.list{padding:8px 0 48px}
.seg{display:inline-flex;background:var(--surface);border-radius:10px;padding:3px;margin-bottom:8px}
.seg label{font-size:14px;font-weight:600;padding:7px 18px;border-radius:8px;color:var(--muted);cursor:pointer}
#sort-latest:checked~.seg label[for=sort-latest],#sort-popular:checked~.seg label[for=sort-popular]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
#sort-latest:checked~.panel.popular,#sort-popular:checked~.panel.latest{display:none}
.row{display:grid;grid-template-columns:1fr 168px;gap:28px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}
.row h3{font:700 19px/1.4 var(--display);letter-spacing:-.025em;margin:8px 0 6px}
.row p{margin:0 0 10px;color:var(--ink-2);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row img,.row .ph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;display:block}
.row .ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface));font:700 20px var(--display);color:var(--accent)}
.row:hover h3{color:var(--accent)}
.row .counts::before{content:" · "}
.card .counts{margin-top:10px}
.asof-text{display:none}
.rank{font:700 15px/1 var(--display);color:var(--accent)}
.empty{color:var(--muted);padding:24px 0}

/* article */
.art-head{padding:44px 0 8px}
.art-head h1{font:700 40px/1.18 var(--display);letter-spacing:-.04em;margin:12px 0 16px}
.archive-note{font-size:14px;line-height:1.6;color:var(--ink-2);background:var(--surface);border-radius:10px;padding:12px 14px;margin:16px 0 8px}
.byline{font-size:13px;color:var(--muted);margin:0}
.quote{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:20px 0 8px}
.quote>div{flex:1 1 140px;padding:14px 16px;border-right:1px solid var(--line)}
.quote>div:last-child{border-right:0}
.quote .k{font-size:12px;color:var(--muted)}
.quote .v{font:700 19px/1.3 var(--display);letter-spacing:-.02em;margin-top:2px}
.quote .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.quote .up{color:var(--pos)}.quote .down{color:var(--neg)}
.answer{background:var(--surface);border-radius:18px;padding:22px 24px;margin:28px 0}
.answer .label{font:600 13px/1 var(--sans);color:var(--accent);margin:0 0 10px}
.answer .lead{font:700 21px/1.45 var(--display);letter-spacing:-.025em;margin:0 0 10px}
.answer p{margin:0 0 8px;color:var(--ink-2);font-size:16px}
.answer p.asof-line{font-size:13px;color:var(--muted);margin:10px 0 0}
.legend{font-size:13px;color:var(--muted);margin:0 0 22px}
.body h2{font:700 26px/1.3 var(--display);letter-spacing:-.03em;margin:64px 0 22px;scroll-margin-top:88px}
.body h3{font:700 22px/1.45 var(--display);letter-spacing:-.02em;margin:56px 0 22px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:88px}
.body h4{font-size:17px;margin:24px 0 8px}
.body p{font-size:17.5px;line-height:1.9;margin:0 0 28px}
.body ul,.body ol{padding-left:1.3em;font-size:17px;line-height:1.75}
.body li{margin:.3em 0}
.body a{color:var(--accent)}
.body blockquote{margin:28px 0 32px;padding:20px 22px;border-left:3px solid var(--accent);border-radius:0 12px 12px 0;background:var(--surface);color:var(--ink-2)}
.body blockquote p{font-size:16px;line-height:1.85;margin-bottom:14px}.body blockquote p:last-child{margin-bottom:0}
.body pre{overflow-x:auto;background:var(--surface);border-radius:12px;padding:14px;font-size:13px;line-height:1.5}
.body code{font-family:var(--mono);font-size:.9em}
.body hr{border:0;border-top:1px solid var(--line);margin:36px 0}
.tone-pos{color:var(--pos);font-weight:600}.tone-neg{color:var(--neg);font-weight:600}.tone-spec{color:var(--spec);font-weight:600}
sup.cite{white-space:nowrap}
.src-note{font-size:13px;color:var(--muted)}
sup.cite a{color:var(--accent);font-size:12px;display:inline-block;min-width:24px;text-align:center;padding:2px 3px;margin:0 2px;text-decoration:underline;text-underline-offset:3px}
.sources li{scroll-margin-top:96px;margin-bottom:16px}
.sources li:target{background:var(--accent-soft);outline:2px solid var(--accent);border-radius:6px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
figure{margin:28px 0}
figure img{max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#fff;display:block;margin:0 auto}
figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.table-scroll{overflow-x:auto;margin:20px 0 36px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:100%;font-size:15px;line-height:1.5}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:10px;border-bottom:1px solid var(--ink);vertical-align:bottom}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th,td{text-align:left;overflow-wrap:normal;word-break:keep-all;min-width:4.5em}
th:first-child,td:first-child{min-width:8em}
td.r,th.r{text-align:left}
td.c,th.c{text-align:left}
.updates li,.sources li{font-size:15px}
.sources ol{color:var(--ink-2)}
.tags{margin:32px 0 0}
.tags a{display:inline-block;margin:0 6px 6px 0;padding:4px 12px;background:var(--surface);border-radius:999px;font-size:13px;color:var(--ink-2)}
.disclaimer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:14px}
.ad{margin:36px 0;min-height:90px}
.toc{position:fixed;top:120px;left:32px;width:180px;font-size:13px;border-left:1px solid var(--line);padding-left:14px;display:none}
.toc a{display:block;padding:7px 0;color:var(--muted);line-height:1.4}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--accent);font-weight:600}
.more{border-top:1px solid var(--line);margin-top:56px;padding:32px 0 32px}
.more h2{font:700 20px/1 var(--display);letter-spacing:-.03em;margin:0 0 16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* plain pages (about, privacy, 404) */
.page{padding:44px 24px 24px}
.page h1{font:700 36px/1.2 var(--display);letter-spacing:-.04em;margin:0 0 20px}

@media (min-width:1240px){.toc{display:block}}
@media (max-width:760px){
  .wrap{padding:0 20px}
  .brand span{display:none}
  header.site nav{gap:16px}
  .rec{padding:32px 0 28px}.rec h1,.list-head h1{font-size:30px}
  .grid,.pair{grid-template-columns:1fr}
  .rec .card h3{font-size:20px}
  .more .card{display:grid;grid-template-columns:112px 1fr;align-items:center;background:none;border-radius:0;padding:16px 0;border-bottom:1px solid var(--line)}
  .more .card img,.more .card .ph{border-radius:12px}
  .more .card .img .asof{display:none}
  .more .card .in{padding:0 0 0 14px}
  .more .card h3{font-size:16.5px;margin:6px 0 4px}
  .more .card p{display:none}
  .more .card .counts{margin-top:4px}
  .more .asof-text{display:block;margin-top:6px}
  .more .asof-text .asof{background:none;border:0;padding:0;font-weight:500;color:var(--muted)}
  .row{grid-template-columns:112px 1fr;gap:14px;padding:18px 0}
  .row>img,.row>.ph{order:-1}
  .row h3{font-size:16.5px}
  .row p{display:none}
  .art-head h1{font-size:28px}
  .quote>div{flex-basis:50%;border-bottom:1px solid var(--line)}
  .page{padding:32px 20px 16px}.page h1{font-size:28px}
}
/* Equal-weight consent actions; visible focus and narrow-screen reflow. */
.stats-consent{position:fixed;z-index:30;bottom:16px;left:16px;right:16px;max-width:720px;margin:auto;padding:22px;background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 36px #0003;border-radius:16px;font-size:14px}
.stats-consent[hidden]{display:none}.stats-consent p{margin:6px 0 16px}.stats-consent a{color:var(--accent);text-decoration:underline}.stats-actions{display:flex;gap:12px;flex-wrap:wrap}
.stats-actions button{flex:1;padding:12px;border:1px solid var(--ink-2);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14px var(--sans);cursor:pointer}
[data-stats-settings]{border:0;padding:0;background:none;color:var(--ink-2);font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* Discovery and reader participation share the site's editorial tokens. */
button,input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-width:100%}
button{cursor:pointer;min-height:44px}button:hover{border-color:var(--accent)}button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.share-buttons{display:flex;gap:8px;flex-wrap:wrap}.sharing{margin:22px 0 8px}.sharing [role=status]{min-height:1.5em;margin:6px 0}
.byline a{text-decoration:underline;text-underline-offset:3px}
.comments{scroll-margin-top:85px}.comments form{padding:20px;background:var(--surface);border-radius:14px;margin:24px 0}
.comments label{display:block;font-size:14px;margin-bottom:16px}.comments input,.comments textarea{display:block;width:100%;margin-top:6px}
.comments textarea{resize:vertical;min-height:130px}.spam-trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
#comment-list{list-style:none;padding:0}#comment-list li{border-bottom:1px solid var(--line);padding:22px 0;font-size:14px}
#comment-list p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;margin:10px 0}#comment-list time{color:var(--muted);font-size:12px}
.search-form>div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search-form input{flex:1;min-width:100px}.search-form label{display:block;margin-bottom:8px;font-size:14px}
.search-result{grid-template-columns:1fr}.search-form a{font-size:14px;text-decoration:underline}
@media(max-width:400px){header.site .wrap{height:auto;min-height:56px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}header.site nav{flex-wrap:wrap}header.site .brand span{display:none}header.site nav{gap:10px;font-size:12px}header.site .wrap{gap:8px}.comments form{padding:16px}.share-buttons button{font-size:14px;padding:9px 12px}}

</style>
{{jsonLd}}
</head>
<body>
<header class="site"><div class="wrap"><a class="brand" href="/"><b>{{siteName}}<i>.</i></b><span>{{tagline}}</span></a><nav>{{nav}}</nav></div></header>
<main>
{{content}}
</main>
<footer class="site"><div class="wrap"><p>{{footerLinks}}<button type="button" data-stats-settings>통계 설정</button></p><p>© {{year}} {{author}} · {{siteName}} · {{tagline}} · 공개 자료 기반 개인 리서치이며 투자 권유가 아닙니다.</p></div></footer>
<script src="/analytics.js" defer></script>
<script src="/card-counts.js" defer></script>
</body>
</html>
