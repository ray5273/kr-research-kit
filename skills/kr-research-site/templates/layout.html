<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="alternate" type="application/atom+xml" title="{{siteName}}" href="{{baseUrl}}/feed.xml">
<meta name="robots" content="{{robots}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:locale" content="ko_KR">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{shareTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
{{ogImage}}
<meta name="twitter:card" content="{{twitterCard}}">
<meta name="twitter:title" content="{{shareTitle}}">
<meta name="twitter:description" content="{{description}}">
{{head}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Design tokens. Type scale 12/13/15/17/20/26/34, spacing in multiples of 4px. */
:root{
  color-scheme:light dark;
  --bg:#ffffff;--surface:#f6f6f4;--ink:#16181a;--ink-2:#3d4145;--muted:#65696e;--line:#e2e2de;--rule:#16181a;
  --accent:#ea5a0c;--accent-text:#c2410c;--accent-soft:#fff3eb;
  --pos:#d1242f;--pos-bg:#fdecee;--neg:#1f63d6;--neg-bg:#e8f0fd;--neu:#65696e;--neu-bg:#f0f0ee;--spec:#9a5b13;
  --fs-xs:12px;--fs-sm:13px;--fs-md:15px;--fs-base:17px;--fs-lg:20px;--fs-xl:26px;--fs-2xl:34px;
  --radius:4px;--wide:1080px;--read:720px;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101214;--surface:#1a1d20;--ink:#f2f2f0;--ink-2:#d0d2d4;--muted:#9a9ea3;--line:#2e3236;--rule:#f2f2f0;
  --accent:#ff7a2f;--accent-text:#ff8f50;--accent-soft:#2a1608;
  --pos:#ff6b6b;--pos-bg:#3a1618;--neg:#5aa2ff;--neg-bg:#13253f;--neu:#a8acb0;--neu-bg:#25282b;--spec:#e0a458}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-base)/1.65 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:var(--wide);margin:0 auto;padding:0 24px}
.narrow{max-width:var(--read);margin:0 auto}
.skip{position:absolute;left:16px;top:-64px;z-index:40;padding:12px 16px;background:var(--ink);color:var(--bg);border-radius:var(--radius)}
.skip:focus{top:8px}

/* header / footer */
header.site{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
header.site .wrap{height:56px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;margin-right:auto}
.brand b{font-size:var(--fs-lg);font-weight:700;line-height:1;letter-spacing:-.03em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:var(--fs-sm);color:var(--muted)}
.nav-wide{display:flex;gap:4px;font-size:var(--fs-md);color:var(--ink-2)}
.nav-wide a{padding:6px 10px;border-radius:999px;transition:background .15s,color .15s}
.nav-wide a:hover{background:var(--surface);color:var(--ink)}
.nav-wide a[aria-current]{color:var(--accent-text);font-weight:600;background:var(--accent-soft)}
.nav-search,.nav-menu{display:none}
.nav-search,.nav-menu summary{min-height:44px;align-items:center;padding:0 8px;font-size:var(--fs-md);color:var(--ink-2);cursor:pointer}
.nav-menu summary{display:flex;gap:8px;list-style:none;-webkit-tap-highlight-color:transparent}
.nav-menu summary::-webkit-details-marker{display:none}
.burger{position:relative;width:18px;height:12px;display:inline-block}
.burger i{position:absolute;left:0;right:0;height:2px;border-radius:2px;background:currentColor;transition:transform .2s,opacity .2s,top .2s}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:5px}.burger i:nth-child(3){top:10px}
.nav-menu[open] .burger i:nth-child(1){top:5px;transform:rotate(45deg)}
.nav-menu[open] .burger i:nth-child(2){opacity:0}
.nav-menu[open] .burger i:nth-child(3){top:5px;transform:rotate(-45deg)}
.nav-menu[open] summary{color:var(--ink)}
.nav-menu[open] summary::before{content:"";position:fixed;inset:56px 0 0;background:rgba(10,12,14,.38);cursor:default;animation:menu-fade .18s ease-out}
.nav-menu nav{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);border-radius:0 0 18px 18px;box-shadow:0 18px 40px rgba(0,0,0,.14);padding:16px 20px 18px;animation:menu-drop .2s ease-out}
.menu-label{margin:0 0 10px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;color:var(--muted)}
.menu-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-tiles a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid transparent;transition:border-color .15s}
.menu-tiles a b{font-size:var(--fs-md);font-weight:600;color:var(--ink)}
.menu-tiles a small{font-size:var(--fs-xs);color:var(--muted)}
.menu-tiles a:active,.menu-tiles a:hover{border-color:var(--line)}
.menu-tiles a[aria-current]{background:var(--accent-soft);border-color:var(--accent)}
.menu-tiles a[aria-current] b{color:var(--accent-text)}
.menu-extra{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.menu-extra a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink-2)}
.menu-extra a[aria-current]{border-color:var(--accent);color:var(--accent-text)}
@keyframes menu-drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes menu-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.nav-menu nav,.nav-menu[open] summary::before{animation:none}.burger i{transition:none}}
footer.site{border-top:1px solid var(--line);padding:24px 0 40px;font-size:var(--fs-sm);color:var(--muted);margin-top:24px}
footer.site p{margin:0 0 8px}
footer.site a{margin-right:12px}
footer.site a:hover{color:var(--ink)}

/* shared bits */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:600;line-height:1;padding:4px 8px;border-radius:var(--radius);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.pos{color:var(--pos);background:var(--pos-bg)}.badge.neg{color:var(--neg);background:var(--neg-bg)}.badge.neu{color:var(--neu);background:var(--neu-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--fs-sm);color:var(--muted)}
.mk{font-weight:600;color:var(--ink-2)}
.arc{color:var(--muted)}
.tk{font:600 var(--fs-xs)/1.4 var(--mono);color:var(--muted)}
.co{font-weight:700;color:var(--ink)}
.asof{font-size:var(--fs-xs);font-weight:600;line-height:1;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:4px 8px;white-space:nowrap}
.asof b{color:var(--accent-text);font-weight:700;margin-right:4px}
.sub{color:var(--muted);font-size:var(--fs-sm)}

/* home: recommended */
.intro{padding:32px 0 24px}
.intro h1{font-size:var(--fs-xl);font-weight:700;line-height:1.3;letter-spacing:-.025em;margin:0 0 4px}
.intro p{margin:0;color:var(--muted);font-size:var(--fs-md)}
.sec-head{font-size:var(--fs-md);font-weight:700;line-height:1.4;margin:0 0 16px;padding-top:8px;border-top:2px solid var(--rule)}
.rec{margin-bottom:32px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
.grid.one{grid-template-columns:1fr}
.grid>.card img,.grid>.card .ph{aspect-ratio:2/1}
.stack{display:grid;gap:16px;align-content:start}
.card{display:block}
.card .img{position:relative}
.card img,.card .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:var(--radius);background:var(--surface)}
.card .ph,.row .ph{display:grid;place-items:center;background:var(--surface);font-weight:700;color:var(--muted)}
.card .ph{font-size:var(--fs-xl)}
.card .img .asof{position:absolute;left:8px;top:8px}
.card .in{padding:12px 0 0}
.card h3{font-size:var(--fs-lg);font-weight:700;line-height:1.35;letter-spacing:-.02em;margin:8px 0}
.card p{margin:0;color:var(--ink-2);font-size:var(--fs-md);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3,.row:hover h3{color:var(--accent-text)}
.stack .card{display:grid;grid-template-columns:168px 1fr;gap:16px;align-items:start;padding-bottom:16px;border-bottom:1px solid var(--line)}
.stack .card:last-child{border-bottom:0}
.stack .card .in{padding:0}
.stack .card h3,.more .card h3{font-size:var(--fs-base);margin:4px 0}
.more .card .in{padding:8px 0 0}

/* lists: one research-index row shared by home, market, tag and search pages */
.list-head{padding:32px 0 16px}
.list-head h1{font-size:var(--fs-2xl);font-weight:700;line-height:1.2;letter-spacing:-.03em;margin:0 0 4px}
.list-head p{color:var(--muted);margin:0;font-size:var(--fs-md)}
.list{padding:8px 0 48px}
.list-bar{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;margin-bottom:8px}
.filter{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--fs-sm);color:var(--muted)}
.filter a{display:inline-flex;align-items:center;gap:4px;min-height:44px}
.filter a:hover{color:var(--ink)}
.filter a[aria-current]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px var(--accent)}
.seg{display:inline-flex;gap:16px;font-size:var(--fs-sm)}
.seg label{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);cursor:pointer}
.sort-input{position:absolute;opacity:0;width:1px;height:1px}
#sort-latest:checked~.list-bar label[for=sort-latest],#sort-popular:checked~.list-bar label[for=sort-popular]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px var(--accent)}
#sort-latest:focus-visible~.list-bar label[for=sort-latest],#sort-popular:focus-visible~.list-bar label[for=sort-popular]{outline:2px solid var(--accent);outline-offset:2px}
#sort-latest:checked~.panel.popular,#sort-popular:checked~.panel.latest{display:none}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) 132px 168px;gap:24px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.row-id{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:var(--fs-sm);line-height:1.35}
.row-id .co{font-size:var(--fs-md)}
.row-tags{display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--muted);font-size:var(--fs-xs)}
.row h3{font-size:var(--fs-base);font-weight:700;line-height:1.4;letter-spacing:-.015em;margin:0 0 4px}
.row p{margin:0;color:var(--ink-2);font-size:var(--fs-md);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{display:flex;flex-direction:column;gap:2px;white-space:nowrap;font-size:var(--fs-xs);line-height:1.45;color:var(--muted)}
.row-meta b{color:var(--ink);font-weight:600}
.row img,.row .ph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--radius);display:block;background:var(--surface)}
.row .ph{font-size:var(--fs-lg)}
.card .counts{margin-top:8px}
.asof-text{display:none}
.rank{font-size:var(--fs-sm);font-weight:700;line-height:1;color:var(--accent-text)}
.empty{color:var(--muted);padding:24px 0}

/* article */
.crumbs{padding:24px 0 0;font-size:var(--fs-sm);color:var(--muted)}
.crumbs a{display:inline-block;padding:4px 0}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs span{margin:0 4px}
.art-head{padding:16px 0 0}
.art-head .co{font-size:var(--fs-md)}
.art-head h1{font-size:var(--fs-2xl);font-weight:700;line-height:1.25;letter-spacing:-.03em;margin:8px 0 16px}
.archive-note{font-size:var(--fs-sm);line-height:1.6;color:var(--ink-2);border-left:2px solid var(--line);padding:0 0 0 12px;margin:16px 0 0}
.dates{font-size:var(--fs-md);color:var(--ink);margin:0 0 4px}
.dates b{font-weight:600;color:var(--muted);font-size:var(--fs-sm);margin-right:4px}
.dates span:first-child b{color:var(--accent-text)}
.dates span+span{margin-left:12px}
.byline{font-size:var(--fs-sm);color:var(--muted);margin:0}
.quote{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--line);margin:16px 0 0}
.quote>div{flex:1 1 140px;padding:12px 16px 12px 0}
.quote .k{font-size:var(--fs-xs);color:var(--muted)}
.quote .v{font-size:var(--fs-lg);font-weight:700;line-height:1.3;margin-top:2px}
.quote .v small{font-size:var(--fs-xs);color:var(--muted);font-weight:500;margin-left:4px}
.quote .up{color:var(--pos)}.quote .down{color:var(--neg)}
.answer{background:var(--surface);border-top:2px solid var(--accent);border-radius:0 0 var(--radius) var(--radius);padding:20px 24px;margin:24px 0 16px;scroll-margin-top:72px}
.answer .label{font-size:var(--fs-sm);font-weight:700;line-height:1;color:var(--accent-text);margin:0 0 12px}
.answer .lead{font-size:var(--fs-lg);font-weight:700;line-height:1.45;letter-spacing:-.02em;margin:0 0 8px}
.answer p{margin:0 0 8px;color:var(--ink-2);font-size:var(--fs-md);line-height:1.7}
.answer p.asof-line{font-size:var(--fs-sm);color:var(--muted);margin:12px 0 0}
.keylinks{display:flex;flex-wrap:wrap;gap:0 16px;margin-top:8px;padding-top:4px;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.keylinks a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.keylinks a:hover{color:var(--accent-text)}
.toc-mobile{position:sticky;top:var(--head-h,56px);z-index:8;margin:20px 0 24px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);font-size:var(--fs-md);box-shadow:0 4px 12px #0000000a}
.toc-mobile summary{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px;cursor:pointer;list-style:none}
.toc-mobile summary::-webkit-details-marker{display:none}
.toc-icon{display:grid;place-items:center;flex:0 0 32px;height:32px;background:var(--accent-soft);color:var(--accent-text);font-size:24px;line-height:1;border-radius:var(--radius)}
.toc-title{min-width:0;flex:1;font-weight:700;line-height:1.3}
.toc-title{display:flex;align-items:baseline;gap:8px}
.toc-title small{display:block;min-width:0;font-size:var(--fs-xs);font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-count{font:600 var(--fs-xs) var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:3px 6px}
.toc-chevron{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px}
.toc-mobile[open] .toc-chevron{transform:rotate(225deg);margin-top:6px}
.toc-mobile nav{max-height:min(52dvh,420px);overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line)}
.toc-mobile ol{margin:0;padding:4px 12px 8px;list-style:none;font-size:var(--fs-md)}
.toc-mobile a{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 8px;color:var(--ink-2);border-bottom:1px solid var(--line);line-height:1.5}
.toc-mobile li:last-child a{border-bottom:0}
.toc-number{font:500 var(--fs-xs) var(--mono);color:var(--muted);flex:0 0 20px}
.toc-mobile a.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.toc-mobile a.on .toc-number{color:var(--accent-text)}
@media(max-width:1239px){article [id],.body [id]{scroll-margin-top:120px}}
.legend{font-size:var(--fs-sm);color:var(--muted);margin:0 0 24px}
.body h2{font-size:var(--fs-xl);font-weight:700;line-height:1.3;letter-spacing:-.025em;margin:56px 0 20px;padding-top:12px;border-top:2px solid var(--rule);scroll-margin-top:72px}
.body h3{font-size:var(--fs-lg);font-weight:700;line-height:1.45;letter-spacing:-.015em;margin:40px 0 12px;scroll-margin-top:72px}
.body h4{font-size:var(--fs-base);line-height:1.5;margin:24px 0 8px}
.body p{font-size:var(--fs-base);line-height:1.85;margin:0 0 24px}
.body ul,.body ol{padding-left:1.3em;font-size:var(--fs-base);line-height:1.75;margin:0 0 24px}
.body li{margin:.3em 0}
.body a{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.body blockquote{margin:24px 0 32px;padding:0 0 0 20px;border-left:2px solid var(--accent);color:var(--ink-2)}
.body blockquote p{font-size:var(--fs-md);line-height:1.8;margin-bottom:12px}.body blockquote p:last-child{margin-bottom:0}
.body pre{overflow-x:auto;background:var(--surface);border-radius:var(--radius);padding:16px;font-size:var(--fs-sm);line-height:1.5}
.body code{font-family:var(--mono);font-size:.9em}
.body hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.tone-pos{color:var(--pos);font-weight:600}.tone-neg{color:var(--neg);font-weight:600}.tone-spec{color:var(--spec);font-weight:600}
sup.cite{white-space:nowrap}
.src-note{font-size:var(--fs-sm);color:var(--muted)}
a.src-mini{font-size:var(--fs-xs);color:var(--muted);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;white-space:nowrap}
a.src-mini:hover{color:var(--accent-text)}
sup.cite a{color:var(--accent-text);font-size:var(--fs-xs);display:inline;padding:2px 3px;margin:0 0 0 2px;text-decoration:underline;text-underline-offset:3px}
.sources li{scroll-margin-top:72px;margin-bottom:12px}
.sources li:target{background:var(--accent-soft);outline:2px solid var(--accent);border-radius:var(--radius)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
figure{margin:24px 0}
figure img{max-width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--line);background:#fff;display:block;margin:0 auto}
figcaption{font-size:var(--fs-sm);color:var(--muted);margin-top:8px;text-align:center}

/* tables: numeric columns align right, overflow is signalled by edge shadows */
.table-scroll{overflow-x:auto;margin:20px 0 32px;-webkit-overflow-scrolling:touch;
  background:linear-gradient(to right,var(--bg) 30%,transparent) left/32px 100% no-repeat local,linear-gradient(to left,var(--bg) 30%,transparent) right/32px 100% no-repeat local,
  linear-gradient(to right,rgba(0,0,0,.14),transparent) left/10px 100% no-repeat scroll,linear-gradient(to left,rgba(0,0,0,.14),transparent) right/10px 100% no-repeat scroll}
table{border-collapse:collapse;min-width:100%;font-size:var(--fs-md);line-height:1.5}
th{font-size:var(--fs-xs);color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:bottom}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th,td{text-align:left;overflow-wrap:normal;word-break:keep-all;min-width:4.5em}
th:first-child,td:first-child{min-width:8em;padding-left:0}
th.num,td.num{text-align:right}
tbody tr:hover td{background:var(--surface)}

/* Broker commentary keeps one full-width reading column on every screen. */
.report-notes{display:grid;gap:16px;margin:20px 0 24px;min-width:0}
.report-note{min-width:0;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.report-note header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:8px}
.report-note header strong{font-size:var(--fs-base)}
.report-note time{font-size:var(--fs-sm);color:var(--muted);font-variant-numeric:tabular-nums}
.body .report-note p{word-break:normal;overflow-wrap:anywhere;margin:12px 0 0}
.body .report-note .report-rating{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);margin:0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.report-archive{margin:0 0 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.report-archive summary{cursor:pointer;padding:14px 4px;min-height:44px;font-weight:600;font-size:var(--fs-md)}
.report-archive summary span{font-size:var(--fs-sm);font-weight:400;color:var(--muted);margin-left:8px}
.report-archive summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.report-archive .report-notes{margin-top:0}
@media(max-width:600px){.report-note{padding:16px}.report-note header{justify-content:space-between}}
.body .comparison-provenance{font-size:var(--fs-sm);color:var(--muted);line-height:1.7;margin-top:-16px}

/* Numbered earnings Q&A: a clear question, attributed answer, then interpretation. */
.qa-card{margin:24px 0;border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--radius);overflow:hidden;min-width:0;background:var(--bg)}
.qa-card header{padding:24px 24px 20px}
.body .qa-card h3{display:flex;align-items:flex-start;gap:12px;margin:0;font-size:var(--fs-lg);line-height:1.5;text-wrap:pretty;word-break:normal;overflow-wrap:anywhere}
.qa-card h3>span:last-child{min-width:0}
.qa-number{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;min-width:40px;padding:4px 8px;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);font:700 var(--fs-md)/1.5 var(--mono);color:var(--accent-text)}
.qa-content{padding:0 24px 24px;min-width:0}
.qa-answer{padding:16px;background:var(--surface);border-radius:var(--radius)}
.qa-followup{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}
.body .qa-card p{margin:0;line-height:1.85;word-break:normal;overflow-wrap:anywhere}
.body .qa-card .qa-label{font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;line-height:1.5;margin:0 0 8px;color:var(--muted)}
.body .qa-card .qa-answer .qa-label{color:var(--accent-text)}
.qa-content>p{margin-bottom:16px}
@media(max-width:600px){.qa-card header{padding:20px 16px 16px}.qa-content{padding:0 16px 16px}.body .qa-card h3{font-size:var(--fs-base);gap:8px}.qa-answer{padding:12px}.qa-number{min-width:36px;padding:3px 6px}}

.updates li,.sources li{font-size:var(--fs-md)}
.sources ol{color:var(--ink-2)}
.tags{margin:32px 0 0}
.tags a{display:inline-block;margin:0 4px 4px 0;padding:4px 8px;border:1px solid var(--line);border-radius:var(--radius);font-size:var(--fs-sm);color:var(--ink-2)}
.tags a:hover{border-color:var(--ink)}
.disclaimer{font-size:var(--fs-sm);color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:16px}
.ad{margin:32px 0;min-height:90px}
.toc{position:fixed;top:88px;left:32px;width:180px;max-height:calc(100vh - 120px);overflow-y:auto;font-size:var(--fs-sm);display:none}
.toc a{display:block;padding:6px 0 6px 12px;border-left:2px solid var(--line);color:var(--muted);line-height:1.4}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);font-weight:600;border-left-color:var(--accent)}
.more{border-top:2px solid var(--rule);margin-top:48px;padding:12px 0 24px}
.more h2{font-size:var(--fs-md);font-weight:700;line-height:1.4;margin:0 0 16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pair>a:hover h3{color:var(--accent-text)}
.pair>a>h3{font-size:var(--fs-base);line-height:1.4;margin:4px 0 0}

/* plain pages (about, privacy, 404) */
.page{padding:32px 24px 24px}
.page h1{font-size:var(--fs-2xl);font-weight:700;line-height:1.25;letter-spacing:-.03em;margin:0 0 20px}
.page a{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}

@media (min-width:1240px){.toc{display:block}.toc-mobile{display:none}}
@media (max-width:960px){
  .row{grid-template-columns:minmax(0,1fr) 168px;grid-template-areas:"id img" "main img" "meta img";gap:4px 24px}
  .row-id{grid-area:id;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 8px}
  .row-main{grid-area:main}.row-meta{grid-area:meta;flex-direction:row;flex-wrap:wrap;gap:0 8px;margin-top:4px}
  .row>img,.row>.ph{grid-area:img}
}
@media (max-width:760px){
  .wrap{padding:0 20px}
  .brand span,.nav-wide{display:none}
  .nav-search{display:flex}.nav-menu{display:block}
  .intro{padding:24px 0 16px}.intro h1{font-size:var(--fs-lg)}
  .list-head{padding:24px 0 12px}.list-head h1{font-size:var(--fs-xl)}
  .grid,.pair{grid-template-columns:1fr}
  .stack .card{grid-template-columns:112px 1fr;gap:12px}
  .stack .card .img .asof{display:none}
  .stack .asof-text{display:block;margin-top:4px}
  .stack .asof-text .asof{background:none;border:0;padding:0;font-weight:500;color:var(--muted)}
  .filter{gap:0 12px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;max-width:100%}
  .more .card{display:grid;grid-template-columns:112px 1fr;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .more .card .img .asof{display:none}
  .more .card .in{padding:0 0 0 12px}
  .more .card p{display:none}
  .more .card .counts{margin-top:4px}
  .more .asof-text{display:block;margin-top:4px}
  .more .asof-text .asof{background:none;border:0;padding:0;font-weight:500;color:var(--muted)}
  .row{grid-template-columns:112px minmax(0,1fr);grid-template-areas:"img id" "img title" "img meta";gap:4px 12px}
  .row-main{display:contents}
  .row h3{grid-area:title;font-size:var(--fs-md);margin:0}
  .row p{display:none}
  .grid>.card p{-webkit-line-clamp:2}
  .art-head h1{font-size:var(--fs-xl);line-height:1.3}
  .quote>div{flex-basis:50%}
  .answer{padding:16px;margin-left:-4px;margin-right:-4px}
  .answer .lead{font-size:var(--fs-base)}
  .body h2{font-size:22px;margin-top:48px}
  .body h3{font-size:18px}
  table{font-size:14px}
  th:first-child,td:first-child{min-width:6em;position:sticky;left:0;background:var(--bg);z-index:1;box-shadow:1px 0 0 var(--line)}
  tbody tr:hover td{background:none}
  .page{padding:24px 20px 16px}.page h1{font-size:var(--fs-xl)}
}
/* Equal-weight consent actions; visible focus and narrow-screen reflow. */
.stats-consent{position:fixed;z-index:30;bottom:16px;left:16px;right:16px;max-width:720px;margin:auto;padding:20px;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:var(--radius);font-size:14px}
.stats-consent[hidden]{display:none}.stats-consent p{margin:4px 0 16px}.stats-consent a{color:var(--accent-text);text-decoration:underline}.stats-actions{display:flex;gap:12px;flex-wrap:wrap}
.stats-actions button{flex:1;padding:12px;border:1px solid var(--ink-2);border-radius:var(--radius);background:var(--surface);color:var(--ink);font:600 14px var(--sans);cursor:pointer}
[data-stats-settings]{border:0;padding:0;min-height:0;background:none;color:var(--ink-2);font:inherit;cursor:pointer}

/* Discovery and reader participation share the site's editorial tokens. */
button,input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;max-width:100%}
button{cursor:pointer;min-height:44px}button:hover{border-color:var(--ink)}button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.share-buttons{display:flex;gap:8px;flex-wrap:wrap}.share-buttons button{font-size:var(--fs-sm);padding:8px 12px}
.sharing{margin:16px 0 8px}.sharing [role=status]{min-height:1.5em;margin:4px 0}
.byline a{text-decoration:underline;text-underline-offset:3px}
.comments{scroll-margin-top:72px}.comments form{padding:20px;background:var(--surface);border-radius:var(--radius);margin:24px 0}
.comments label{display:block;font-size:14px;margin-bottom:16px}.comments input,.comments textarea{display:block;width:100%;margin-top:4px}
.comments textarea{resize:vertical;min-height:130px}.spam-trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.comments .sub a{text-decoration:underline;text-underline-offset:3px}
#comment-list{list-style:none;padding:0}#comment-list li{border-bottom:1px solid var(--line);padding:20px 0;font-size:14px}
#comment-list p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs-md);margin:8px 0}#comment-list time{color:var(--muted);font-size:var(--fs-xs)}
.search-page{max-width:var(--read);margin:0;padding-bottom:8px}
.search-form>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search-form input{flex:1;min-width:100px;min-height:44px}.search-form label{display:block;margin-bottom:8px;font-size:14px}
.search-form a{font-size:14px;text-decoration:underline}
#search-status{font-size:var(--fs-sm);color:var(--muted);margin:16px 0 8px}
#search-back{display:inline-flex;align-items:center;min-height:44px;font-size:var(--fs-sm);text-decoration:underline;margin-bottom:24px}
#comment-list .comment-reply{margin:12px 0 0 16px;padding:12px 16px;background:var(--surface);border-left:2px solid var(--accent);border-radius:var(--radius)}
.comment-reply strong{font-size:var(--fs-xs);color:var(--accent-text)}
.comment-jump{position:fixed;z-index:20;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:12px 18px;background:var(--ink);color:var(--bg);border-radius:999px;font-size:var(--fs-sm);font-weight:600;text-decoration:none}
@media print{.comment-jump{display:none}}
@media(max-width:400px){.comments form{padding:16px}}
/* Earnings tools retain the editorial rules and existing theme tokens. */
.research-widgets{margin-top:32px}.research-widgets small{display:block;font-size:var(--fs-xs);color:var(--muted);margin-top:6px}
.research-widgets caption{text-align:left;font-weight:600;padding:8px 0}
.research-widgets th,.research-widgets td{text-align:left;min-width:0}
.research-widgets table{width:100%;min-width:0}
.research-widgets td{overflow-wrap:break-word}
.research-widgets th[scope="row"]{white-space:nowrap}
.research-widgets th{color:var(--ink-2)}
tbody th[scope="row"]{vertical-align:top}
.metric-chart{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:16px 0 24px}
.metric-head{display:flex;gap:16px;align-items:start;justify-content:space-between;margin-bottom:4px}
.body .metric-head h3{font-size:var(--fs-base);margin:0;line-height:1.4}
.body .metric-head p{font-size:var(--fs-lg);font-weight:700;line-height:1.3;margin:0;text-align:right}
.metric-head small{font-weight:400}
.metric-head p small{display:block;font-size:var(--fs-xs);color:var(--muted)}
.metric-chart svg{display:block;width:100%;max-width:560px;min-width:0;height:auto;margin:0 auto;color:var(--ink)}
.metric-chart svg text{font:14px var(--sans);fill:var(--muted)}
.metric-chart details{font-size:var(--fs-sm);border-top:1px solid var(--line);padding-top:4px}
.metric-chart summary{min-height:44px;cursor:pointer;padding:10px 0}
.metric-chart figcaption{font-size:var(--fs-xs);line-height:1.5;margin-top:4px}
@media(max-width:760px){.metric-chart{padding:12px}.toc-mobile summary{padding:6px 12px;gap:10px}.toc-icon{display:none}}
.metric-chart .actual{stroke:var(--accent);fill:var(--accent);stroke-width:2}
.metric-chart .estimate{stroke:var(--accent);fill:var(--bg);stroke-width:2;stroke-dasharray:5 4}
.metric-chart .axis{stroke:var(--line)}
.scenario{background:var(--surface);padding:16px 20px;margin:32px 0}
.scenario form{display:flex;gap:16px;flex-wrap:wrap;align-items:end}.scenario label{flex:1;min-width:160px}
.scenario input{display:block;width:100%;margin-top:6px}.scenario output{display:block;font-weight:700;padding:20px 0;min-height:84px}
.company-page header{border-bottom:1px solid var(--rule);padding-bottom:24px}
@media(max-width:760px){.scenario{padding:12px}.scenario form{display:block}.scenario label{display:block;margin-bottom:16px}}
/* Compact statements and checks share the article's editorial spacing. */
.record-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.record-card{border:1px solid var(--line);padding:16px;border-radius:var(--radius);min-width:0}
.body .record-card h3{font-size:var(--fs-base);margin:8px 0;border:0;padding:0}
.body .record-card p{margin:8px 0;font-size:var(--fs-sm)}
.nowrap{white-space:nowrap}
#earnings-comparison td small{color:var(--muted);font-size:var(--fs-xs);margin-left:4px}
.next-check{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.next-check .label{margin:0 0 4px;font-size:var(--fs-sm);font-weight:700;color:var(--accent-text)}
.next-check ul{margin:0;padding-left:20px}
.verdict{display:inline-block;font-size:var(--fs-xs);font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:var(--radius);padding:2px 8px}
.rating-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;list-style:none;margin:8px 0 12px;padding:0}
.rating-scale li{text-align:center;font-size:var(--fs-xs);padding:8px 2px;border:1px solid var(--line);border-radius:var(--radius);color:var(--muted);white-space:nowrap}
.rating-scale li.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.rating td small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.rating-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--fs-sm);margin:12px 0 0}
.verdict-line{margin:-8px 0 12px;font-size:var(--fs-xs);color:var(--muted);display:flex;gap:8px;align-items:center}
.period-head{font-size:var(--fs-md);font-weight:700;margin:24px 0 0;padding-bottom:8px;border-bottom:2px solid var(--rule)}
.period-group .row:first-of-type{border-top:0}
.update-list{font-size:var(--fs-sm);color:var(--ink-2)}
.scenario-warning{border-left:3px solid var(--accent);padding-left:12px}
.scenario details{margin:12px 0}.scenario summary{cursor:pointer;padding:10px 0;min-height:44px}
.scenario-valuation{border-top:1px solid var(--line);font-size:var(--fs-sm)}
@media(max-width:600px){
 .record-cards{grid-template-columns:1fr}
 #earnings-comparison td small{display:block}
}
</style>
