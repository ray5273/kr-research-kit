interface:
  display_name: "Korean Stock Data Pack"
  short_description: "Collect a dated company fact pack before writing a Korean stock memo."
  default_prompt: "Use $kr-stock-data-pack to gather a dated Korean stock fact pack. When $kr-order-backlog-analysis artifacts exist, ingest their classification, official-versus-proxy basis, dated and undated amounts, final disclosed year, coverage ratio, and backlog PNG path into a distinct `Order Backlog Inputs` block."

policy:
  allow_implicit_invocation: true
