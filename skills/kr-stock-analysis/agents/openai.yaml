interface:
  display_name: "Korean Stock Analysis"
  short_description: "Analyze KRX-listed companies with DART, valuation, governance checks, chart context, archetype-specific uncomfortable questions, and decision-memo stance."
  default_prompt: "Use $kr-stock-analysis to prepare a dated KRX decision memo from the scoped brief and source artifacts. For `Order-driven company: yes`, consume $kr-order-backlog-analysis, embed `assets/<company>-order-backlog.png` under `Order Backlog and Revenue Visibility`, and preserve the official-versus-proxy basis. Keep the full-memo decision sections and write `analysis-example/kr/<company>/memo.md` when writable."

policy:
  allow_implicit_invocation: true
