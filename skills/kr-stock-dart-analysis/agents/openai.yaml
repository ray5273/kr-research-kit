interface:
  display_name: "Korean DART Analysis"
  short_description: "한국 DART 공시에서 실적, 사업부문, 수주계약 등 핵심 내용을 근거 중심으로 추출합니다."
  default_prompt: "Use $kr-stock-dart-analysis to extract precise, source-mapped DART evidence for a KRX-listed company. For an order-driven route, distinguish official revenue schedules, project-level remaining amounts, individual-contract maturity proxies, and total-only backlog, then hand the chart-ready fields to $kr-order-backlog-analysis without inventing a yearly allocation. Keep note-driven work DART-first and label unresolved coverage honestly."

policy:
  allow_implicit_invocation: true
